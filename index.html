<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfuCare - Quản Lý Thiết Bị IoT Y Tế</title>
    <!-- Thư viện MQTT.js qua CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.97);
            --card-border: #cbd5e1;
            --primary-blue: #0284c7;
            --neon-green: #16a34a;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-blue: #2563eb;
            --danger-red: #dc2626;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(248, 250, 252, 0.55); 
            z-index: -1;
        }
        .header-bar {
            background: var(--card-bg);
            padding: 16px 25px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            backdrop-filter: blur(12px);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-blue);
            letter-spacing: 0.5px;
        }
        .header-bottom {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .dept-tabs {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: nowrap;
        }
        .tab-wrapper {
            display: inline-flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .tab-wrapper.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .tab-wrapper.active .tab-btn {
            color: white;
        }
        .tab-delete-icon {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 0 10px;
            cursor: pointer;
            font-size: 13px;
            height: 100%;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .tab-delete-icon:hover {
            color: var(--danger-red);
            background: rgba(239, 68, 68, 0.1);
        }
        .tab-wrapper.active .tab-delete-icon {
            color: rgba(255, 255, 255, 0.7);
        }
        .tab-wrapper.active .tab-delete-icon:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-add-dept {
            background: #f1f5f9;
            border: 1.5px dashed var(--primary-blue);
            color: var(--primary-blue);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-add-dept:hover {
            background: #e0f2fe;
        }
        .actions-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-action {
            background: #ffffff;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-action:hover {
            background: #f1f5f9;
        }
        .btn-add {
            background: #059669;
            border: none;
            color: white;
            display: none;
        }
        .btn-add:hover {
            background: #047857;
        }
        .btn-admin {
            background: #0f172a;
            color: white;
            border: none;
        }
        .btn-admin.logged-in {
            background: #16a34a;
        }
        .connection-badge {
            background: #fef2f2;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: var(--danger-red);
            border: 1px solid #fecaca;
            white-space: nowrap;
        }
        .connection-badge.online {
            color: var(--neon-green);
            background: #f0fdf4;
            border-color: #bbf7d0;
        }
        .content-container {
            margin-top: 20px;
        }
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .device-card {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .device-card:hover {
            box-shadow: 0 15px 30px rgba(0,0,0,0.16);
            transform: translateY(-2px);
        }
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1.5px solid var(--card-border);
            padding-bottom: 10px;
        }
        .device-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
        }
        .btn-delete {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: var(--danger-red);
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
            display: none;
        }
        .btn-delete:hover {
            background: #fecaca;
        }
        .bed-assign-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            margin-bottom: 12px;
        }
        .bed-assign-row label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: bold;
        }
        .bed-input {
            background: #ffffff;
            border: 1px solid var(--card-border);
            color: var(--primary-blue);
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 6px;
            width: 95px;
            text-align: center;
            font-size: 13px;
            pointer-events: none;
        }
        .metric-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid var(--card-border);
        }
        .metric-label {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .metric-value-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .metric-value {
            font-size: 26px;
            font-weight: bold;
            color: var(--neon-green);
        }
        .metric-value.target {
            color: var(--primary-blue);
        }
        .metric-unit {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .device-status-footer {
            background: #fef2f2;
            text-align: center;
            padding: 9px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--danger-red);
            margin-top: 10px;
            font-weight: bold;
            border: 1px solid #fecaca;
        }
        .device-status-footer.active {
            color: #15803d;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
        }
        .device-status-footer.warning {
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fecaca;
            animation: pulse-alert 1.5s infinite;
        }
        @keyframes pulse-alert {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .device-table-wrapper {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--card-border);
            color: var(--text-main);
        }
        th {
            background: #f1f5f9;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: bold;
        }
        tr:hover {
            background: rgba(241, 245, 249, 0.8);
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="header-top">
            <div class="logo">InfuCare Dashboard</div>
            <div class="actions-right">
                <button class="btn-action btn-add" id="btn-add-dev-main" onclick="addNewDevice()">+ Thêm Thiết Bị</button>
                <button class="btn-action" onclick="setViewMode('grid')" id="btn-grid">🔲 Lưới</button>
                <button class="btn-action" onclick="setViewMode('table')" id="btn-table">📋 Bảng</button>
                <button class="btn-action btn-admin" id="btn-admin-auth" onclick="toggleAdminAuth()">🔒 Đăng nhập Quản trị</button>
                <div id="connection-status" class="connection-badge">Đang kết nối...</div>
            </div>
        </div>

        <div class="header-bottom">
            <div class="dept-tabs" id="dept-tabs-container"></div>
        </div>
    </div>

    <div class="content-container" id="main-content"></div>

    <script>
        const brokerUrl = 'wss://dc96c9840eee44adbb0987edf4172106.s1.eu.hivemq.cloud:8884/mqtt';
        const options = {
            clientId: 'WebDashboard_' + Math.random().toString(16).substr(2, 8),
            username: 'drip_monitor_user',
            password: 'TamCaMau2026',
            clean: true
        };

        const client = mqtt.connect(brokerUrl, options);

        let telemetryStore = {};
        const ADMIN_PASSWORD = "tamcamau2026";
        let isAdminLoggedIn = sessionStorage.getItem('infucare_admin_auth') === 'true';

        function getDepartments() {
            let depts = JSON.parse(localStorage.getItem('infucare_departments'));
            if (!depts || depts.length === 0) {
                depts = [
                    { key: 'KHOA_A', name: 'Khoa A' },
                    { key: 'KHOA_B', name: 'Khoa B' },
                    { key: 'KHOA_C', name: 'Khoa C' }
                ];
                localStorage.setItem('infucare_departments', JSON.stringify(depts));
            }
            return depts;
        }

        let currentDept = localStorage.getItem('infucare_current_dept');
        let deptsList = getDepartments();
        if (!currentDept || !deptsList.some(d => d.key === currentDept)) {
            currentDept = deptsList[0].key;
            localStorage.setItem('infucare_current_dept', currentDept);
        }

        let currentView = localStorage.getItem('infucare_view_mode') || 'grid';

        document.addEventListener("DOMContentLoaded", () => {
            updateAdminUIState();
            renderDeptTabs();
            renderApp();
        });

        function toggleAdminAuth() {
            if (isAdminLoggedIn) {
                if (confirm("Bạn có muốn đăng xuất quyền quản trị không?")) {
                    isAdminLoggedIn = false;
                    sessionStorage.removeItem('infucare_admin_auth');
                    updateAdminUIState();
                    renderApp();
                    alert("Đã đăng xuất quyền quản trị.");
                }
            } else {
                let pass = prompt("Nhập mật khẩu quản trị hệ thống:");
                if (pass === ADMIN_PASSWORD) {
                    isAdminLoggedIn = true;
                    sessionStorage.setItem('infucare_admin_auth', 'true');
                    updateAdminUIState();
                    renderApp();
                    alert("Đăng nhập quản trị thành công!");
                } else if (pass !== null) {
                    alert("Mật khẩu không chính xác!");
                }
            }
        }

        function updateAdminUIState() {
            const btnAuth = document.getElementById('btn-admin-auth');
            const btnAddDev = document.getElementById('btn-add-dev-main');
            
            if (isAdminLoggedIn) {
                btnAuth.innerText = "🔓 Đã mở khóa Quyền (Admin)";
                btnAuth.classList.add('logged-in');
                btnAddDev.style.display = "flex";
            } else {
                btnAuth.innerText = "🔒 Đăng nhập Quản trị";
                btnAuth.classList.remove('logged-in');
                btnAddDev.style.display = "none";
            }
        }

        function renderDeptTabs() {
            let depts = getDepartments();
            let html = '';
            depts.forEach(d => {
                let isActive = d.key === currentDept ? 'active' : '';
                let deleteBtn = (isAdminLoggedIn && depts.length > 1) ? `<button class="tab-delete-icon" title="Xóa khoa" onclick="removeDept('${d.key}', event)">🗑</button>` : '';
                html += `
                    <div class="tab-wrapper ${isActive}">
                        <button class="tab-btn" onclick="switchDept('${d.key}')">${d.name}</button>
                        ${deleteBtn}
                    </div>
                `;
            });
            if (isAdminLoggedIn) {
                html += `<button class="btn-add-dept" style="display:inline-block;" onclick="addNewDept()">+ Thêm Khoa</button>`;
            }
            document.getElementById('dept-tabs-container').innerHTML = html;
        }

        function addNewDept() {
            if (!isAdminLoggedIn) return alert("Vui lòng đăng nhập quản trị trước!");
            let deptName = prompt("Nhập tên khoa mới (ví dụ: Khoa Cấp Cứu, Khoa Nhi...):");
            if (!deptName || deptName.trim() === "") return;
            
            let key = 'KHOA_' + Date.now();
            let depts = getDepartments();
            depts.push({ key: key, name: deptName.trim() });
            localStorage.setItem('infucare_departments', JSON.stringify(depts));
            
            switchDept(key);
        }

        function removeDept(deptKey, event) {
            event.stopPropagation();
            if (!isAdminLoggedIn) return alert("Vui lòng đăng nhập quản trị trước!");
            let depts = getDepartments();
            if (depts.length <= 1) {
                alert("Cần duy trì ít nhất một khoa trong hệ thống!");
                return;
            }
            if (confirm("Bạn có chắc chắn muốn xóa khoa này cùng toàn bộ thiết bị trong khoa không?")) {
                let filtered = depts.filter(d => d.key !== deptKey);
                localStorage.setItem('infucare_departments', JSON.stringify(filtered));
                
                if (currentDept === deptKey) {
                    currentDept = filtered[0].key;
                    localStorage.setItem('infucare_current_dept', currentDept);
                }
                renderDeptTabs();
                renderApp();
            }
        }

        function getDeviceCount() {
            return parseInt(localStorage.getItem(`infucare_device_count_${currentDept}`)) || 0;
        }

        function getGlobalDeviceIndex(deptKey, localIndex) {
            let mapping = JSON.parse(localStorage.getItem('infucare_device_mapping') || '{}');
            let key = `${deptKey}_${localIndex}`;
            if (!mapping[key]) {
                let allValues = Object.values(mapping);
                let maxId = allValues.length > 0 ? Math.max(...allValues) : 0;
                let nextId = maxId + 1;
                
                mapping[key] = nextId;
                localStorage.setItem('infucare_device_mapping', JSON.stringify(mapping));
            }
            return mapping[key];
        }

        function getCurrentDeptName() {
            let depts = getDepartments();
            let d = depts.find(x => x.key === currentDept);
            return d ? d.name : 'Khoa';
        }

        function renderApp() {
            renderDeptTabs();
            let count = getDeviceCount();
            let deptName = getCurrentDeptName();

            if (count === 0) {
                let addBtnHtml = isAdminLoggedIn ? `<button class="btn-action btn-add" onclick="addNewDevice()" style="margin: 0 auto; display: flex;">+ Thêm Thiết Bị</button>` : `<p style="color: var(--text-muted); font-size: 13px;">Chế độ chỉ xem. Đăng nhập Quản trị để thêm thiết bị.</p>`;
                document.getElementById('main-content').innerHTML = `
                    <div style="text-align: center; padding: 50px; background: var(--card-bg); border-radius: 16px; border: 1.5px solid var(--card-border);">
                        <h3 style="color: var(--text-muted); margin-bottom: 10px;">Chưa có thiết bị nào trong ${deptName}</h3>
                        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Theo dõi trực tuyến các giường bệnh qua MQTT.</p>
                        ${addBtnHtml}
                    </div>
                `;
                return;
            }

            if (currentView === 'grid') {
                renderGridView();
            } else {
                renderTableView();
            }
            restoreTelemetryToUI();
        }

        function formatStatusText(statusStr) {
            if (!statusStr || statusStr === "CONNECTED") return "Đã kết nối";
            if (statusStr === "NORMAL") return "Đang hoạt động";
            if (statusStr === "DEVIATED") return "⚠️ CẢNH BÁO: Lệch tốc độ!";
            if (statusStr === "STOPPED") return "⚠️ CẢNH BÁO: Dừng chảy (0 gtt)!";
            if (statusStr === "COMPLETED") return "✅ Đã hoàn thành đủ thể tích!";
            if (statusStr === "EXCEEDED") return "⚠️ CẢNH BÁO: Vượt mức (>200)!";
            if (statusStr === "BELOW") return "⚠️ CẢNH BÁO: Dưới mức (<10)!";
            if (statusStr === "DISCONNECTED") return "Chưa kết nối";
            return statusStr;
        }

        function renderGridView() {
            let count = getDeviceCount();
            let deptName = getCurrentDeptName(); 
            let html = '<div class="device-grid">';
            for (let i = 1; i <= count; i++) {
                let globalId = getGlobalDeviceIndex(currentDept, i);
                let devTopicId = globalId < 10 ? `dev0${globalId}` : `dev${globalId}`;
                let savedBed = localStorage.getItem(`infucare_${currentDept}_dev_${i}_bed`) || `Giường ${i}`;
                
                let deleteBtnHtml = isAdminLoggedIn ? `<button class="btn-delete" title="Xóa thiết bị" onclick="removeDevice(${i})" style="display: inline-block;">🗑️ Xóa</button>` : '';
                let inputStyle = isAdminLoggedIn ? 'pointer-events: auto;' : 'pointer-events: none; background: #f1f5f9;';

                html += `
                    <div class="device-card" id="device-ui-${currentDept}-${i}" data-topicid="${devTopicId}">
                        <div class="device-header">
                            <span class="device-title">Thiết bị ${globalId} - ${deptName}</span>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="font-size: 11px; color: var(--primary-blue); font-weight: bold; background: #e0f2fe; padding: 2px 6px; border-radius: 4px;" id="battery-${devTopicId}">🔋 Pin: --%</span>
                                ${deleteBtnHtml}
                            </div>
                        </div>
                        
                        <div class="bed-assign-row">
                            <label>VỊ TRÍ LẮP ĐẶT:</label>
                            <input type="text" class="bed-input" id="bedname-${currentDept}-${i}" value="${savedBed}" onchange="saveBedMapping('${i}')" placeholder="Nhập giường..." style="${inputStyle}">
                        </div>

                        <div class="metric-box">
                            <div class="metric-label">ACTUAL SPEED</div>
                            <div class="metric-value-row">
                                <span class="metric-value" id="flow-${devTopicId}">0</span>
                                <span class="metric-unit">gtt/min</span>
                            </div>
                        </div>

                        <div class="metric-box">
                            <div class="metric-label">TARGET SPEED</div>
                            <div class="metric-value-row">
                                <span class="metric-value target" id="target-${devTopicId}">0</span>
                                <span class="metric-unit">gtt/min</span>
                            </div>
                        </div>

                        <div class="metric-box">
                            <div class="metric-label">TOTAL VOLUME (Infused / Limit)</div>
                            <div class="metric-value-row">
                                <span class="metric-value" style="font-size: 18px;"><span id="infval-${devTopicId}">0</span> / <span id="limit-${devTopicId}">0</span></span>
                                <span class="metric-unit">ml</span>
                            </div>
                        </div>

                        <div class="device-status-footer" id="status-${devTopicId}">
                            Chưa kết nối
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            document.getElementById('main-content').innerHTML = html;
        }

        function renderTableView() {
            let count = getDeviceCount();
            let deptName = getCurrentDeptName();
            let html = `
                <div class="device-table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Thiết bị</th>
                                <th>Vị trí lắp đặt</th>
                                <th>Pin</th>
                                <th>Tốc độ thực tế</th>
                                <th>Tốc độ cài đặt (Target)</th>
                                <th>Đã truyền / Giới hạn (mL)</th>
                                <th>Trạng thái</th>
                                <th style="text-align: center;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            for (let i = 1; i <= count; i++) {
                let globalId = getGlobalDeviceIndex(currentDept, i);
                let devTopicId = globalId < 10 ? `dev0${globalId}` : `dev${globalId}`;
                let savedBed = localStorage.getItem(`infucare_${currentDept}_dev_${i}_bed`) || `Giường ${i}`;
                
                let inputStyle = isAdminLoggedIn ? 'pointer-events: auto;' : 'pointer-events: none; background: #f1f5f9;';
                let deleteTd = isAdminLoggedIn ? `<td style="text-align: center;"><button class="btn-delete" onclick="removeDevice(${i})" style="display: inline-block;">🗑️ Xóa</button></td>` : `<td style="text-align: center; color: var(--text-muted); font-size: 12px;">Chỉ xem</td>`;

                html += `
                    <tr id="device-ui-${currentDept}-${i}" data-topicid="${devTopicId}">
                        <td style="font-weight: bold; color: var(--primary-blue);">Thiết bị ${globalId} - ${deptName}</td>
                        <td><input type="text" class="bed-input" id="bedname-tbl-${currentDept}-${i}" value="${savedBed}" onchange="saveBedMappingTable('${i}')" style="${inputStyle}"></td>
                        <td><span id="battery-tbl-${devTopicId}" style="font-weight: bold; color: var(--primary-blue);">--%</span></td>
                        <td><span id="flow-tbl-${devTopicId}" style="color: var(--neon-green); font-weight: bold;">0</span> gtt/min</td>
                        <td><span id="target-tbl-${devTopicId}" style="color: var(--primary-blue); font-weight: bold;">0</span> gtt/min</td>
                        <td><span id="infval-tbl-${devTopicId}">0</span> / <span id="limit-tbl-${devTopicId}">0</span> ml</td>
                        <td id="status-tbl-${devTopicId}" style="color: var(--danger-red); font-weight: bold;">Chưa kết nối</td>
                        ${deleteTd}
                    </tr>
                `;
            }
            html += `
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function switchDept(deptKey) {
            currentDept = deptKey;
            localStorage.setItem('infucare_current_dept', deptKey);
            renderApp();
        }

        function addNewDevice() {
            if (!isAdminLoggedIn) return alert("Vui lòng đăng nhập quản trị!");
            let count = getDeviceCount() + 1;
            localStorage.setItem(`infucare_device_count_${currentDept}`, count);
            renderApp();
        }

        function removeDevice(index) {
            if (!isAdminLoggedIn) return alert("Vui lòng đăng nhập quản trị!");
            let count = getDeviceCount();
            if (confirm(`Bạn có chắc chắn muốn xóa thiết bị này không?`)) {
                let mapping = JSON.parse(localStorage.getItem('infucare_device_mapping') || '{}');
                delete mapping[`${currentDept}_${index}`];
                localStorage.setItem('infucare_device_mapping', JSON.stringify(mapping));

                for (let i = index; i < count; i++) {
                    let nextBed = localStorage.getItem(`infucare_${currentDept}_dev_${i+1}_bed`) || `Giường ${i+1}`;
                    localStorage.setItem(`infucare_${currentDept}_dev_${i}_bed`, nextBed);
                    let nextMapKey = `${currentDept}_${i+1}`;
                    let currMapKey = `${currentDept}_${i}`;
                    if (mapping[nextMapKey]) {
                        mapping[currMapKey] = mapping[nextMapKey];
                        delete mapping[nextMapKey];
                    }
                }
                localStorage.removeItem(`infucare_${currentDept}_dev_${count}_bed`);
                localStorage.setItem('infucare_device_mapping', JSON.stringify(mapping));
                localStorage.setItem(`infucare_device_count_${currentDept}`, count - 1);
                renderApp();
            }
        }

        function setViewMode(mode) {
            currentView = mode;
            localStorage.setItem('infucare_view_mode', mode);
            renderApp();
        }

        function saveBedMapping(i) {
            if (!isAdminLoggedIn) return;
            let val = document.getElementById(`bedname-${currentDept}-${i}`).value;
            localStorage.setItem(`infucare_${currentDept}_dev_${i}_bed`, val);
        }

        function saveBedMappingTable(i) {
            if (!isAdminLoggedIn) return;
            let val = document.getElementById(`bedname-tbl-${currentDept}-${i}`).value;
            localStorage.setItem(`infucare_${currentDept}_dev_${i}_bed`, val);
        }

        function restoreTelemetryToUI() {
            let count = getDeviceCount();
            for (let i = 1; i <= count; i++) {
                let globalId = getGlobalDeviceIndex(currentDept, i);
                let devTopicId = globalId < 10 ? `dev0${globalId}` : `dev${globalId}`;
                let data = telemetryStore[devTopicId];
                if (!data) continue;

                if (currentView === 'grid') {
                    if (data.battery !== undefined) {
                        let el = document.getElementById(`battery-${devTopicId}`);
                        if(el) el.innerText = `🔋 Pin: ${data.battery}%`;
                    }
                    if (data.flow !== undefined) {
                        let el = document.getElementById(`flow-${devTopicId}`);
                        if(el) el.innerText = data.flow;
                    }
                    if (data.infused !== undefined) {
                        let el = document.getElementById(`infval-${devTopicId}`);
                        if(el) el.innerText = data.infused;
                    }
                    if (data.target !== undefined) {
                        let el = document.getElementById(`target-${devTopicId}`);
                        if(el) el.innerText = data.target;
                    }
                    if (data.limit !== undefined) {
                        let el = document.getElementById(`limit-${devTopicId}`);
                        if(el) el.innerText = data.limit;
                    }
                    if (data.statusText !== undefined) {
                        let footer = document.getElementById(`status-${devTopicId}`);
                        if(footer) {
                            footer.innerText = formatStatusText(data.statusText);
                            if (data.statusText === "CONNECTED" || data.statusText === "NORMAL" || data.statusText === "COMPLETED") {
                                footer.classList.add('active');
                                footer.classList.remove('warning');
                            } else if (data.statusText === "DISCONNECTED") {
                                footer.classList.remove('active');
                                footer.classList.remove('warning');
                            } else {
                                footer.classList.remove('active');
                                footer.classList.add('warning');
                            }
                        }
                    }
                } else {
                    if (data.battery !== undefined) {
                        let el = document.getElementById(`battery-tbl-${devTopicId}`);
                        if(el) el.innerText = `${data.battery}%`;
                    }
                    if (data.flow !== undefined) {
                        let el = document.getElementById(`flow-tbl-${devTopicId}`);
                        if(el) el.innerText = data.flow;
                    }
                    if (data.infused !== undefined) {
                        let el = document.getElementById(`infval-tbl-${devTopicId}`);
                        if(el) el.innerText = data.infused;
                    }
                    if (data.target !== undefined) {
                        let el = document.getElementById(`target-tbl-${devTopicId}`);
                        if(el) el.innerText = data.target;
                    }
                    if (data.limit !== undefined) {
                        let el = document.getElementById(`limit-tbl-${devTopicId}`);
                        if(el) el.innerText = data.limit;
                    }
                    if (data.statusText !== undefined) {
                        let statTbl = document.getElementById(`status-tbl-${devTopicId}`);
                        if(statTbl) {
                            statTbl.innerText = formatStatusText(data.statusText);
                            if (data.statusText === "CONNECTED" || data.statusText === "NORMAL" || data.statusText === "COMPLETED") {
                                statTbl.style.color = "var(--neon-green)";
                            } else if (data.statusText === "DISCONNECTED") {
                                statTbl.style.color = "var(--danger-red)";
                            } else {
                                statTbl.style.color = "var(--danger-red)";
                            }
                        }
                    }
                }
            }
        }

        client.on('connect', () => {
            const badge = document.getElementById('connection-status');
            badge.innerText = 'ONLINE';
            badge.classList.add('online');
            client.subscribe('drip_monitor/#');
        });

        client.on('offline', () => {
            const badge = document.getElementById('connection-status');
            badge.innerText = 'DISCONNECTED';
            badge.classList.remove('online');
        });

        client.on('message', (topic, payload) => {
            const message = payload.toString();
            const parts = topic.split('/');
            
            if (parts.length >= 3) {
                const devTopicId = parts[1]; 
                const metric = parts[2]; 

                if (!telemetryStore[devTopicId]) telemetryStore[devTopicId] = {};

                if (metric === 'flow') telemetryStore[devTopicId].flow = message;
                if (metric === 'infused') telemetryStore[devTopicId].infused = message;
                if (metric === 'target') telemetryStore[devTopicId].target = message;
                if (metric === 'limit_ml') telemetryStore[devTopicId].limit = message;
                if (metric === 'status') telemetryStore[devTopicId].statusText = message;
                if (metric === 'battery') telemetryStore[devTopicId].battery = message;

                if (currentView === 'grid') {
                    if (metric === 'battery') {
                        let el = document.getElementById(`battery-${devTopicId}`);
                        if(el) el.innerText = `🔋 Pin: ${message}%`;
                    } else if (metric === 'flow') {
                        let el = document.getElementById(`flow-${devTopicId}`);
                        if(el) el.innerText = message;
                    } else if (metric === 'infused') {
                        let el = document.getElementById(`infval-${devTopicId}`);
                        if(el) el.innerText = message;
                    } else if (metric === 'target') {
                        let el = document.getElementById(`target-${devTopicId}`);
                        if(el) el.innerText = message;
                    } else if (metric === 'limit_ml') {
                        let limitEl = document.getElementById(`limit-${devTopicId}`);
                        if(limitEl) limitEl.innerText = message;
                    } else if (metric === 'status') {
                        let footer = document.getElementById(`status-${devTopicId}`);
                        if(footer) {
                            footer.innerText = formatStatusText(message);
                            if (message === "CONNECTED" || message === "NORMAL" || message === "COMPLETED") {
                                footer.classList.add('active');
                                footer.classList.remove('warning');
                            } else if (message === "DISCONNECTED") {
                                footer.classList.remove('active');
                                footer.classList.remove('warning');
                            } else {
                                footer.classList.remove('active');
                                footer.classList.add('warning');
                            }
                        }
                    }
                } else {
                    if (metric === 'battery') {
                        let el = document.getElementById(`battery-tbl-${devTopicId}`);
                        if(el) el.innerText = `${message}%`;
                    } else if (metric === 'flow') {
                        let el = document.getElementById(`flow-tbl-${devTopicId}`);
                        if(el) el.innerText = message;
                    } else if (metric === 'infused') {
                        let el = document.getElementById(`infval-tbl-${devTopicId}`);
                        if(el) el.innerText = message;
                    } else if (metric === 'target') {
                        let el = document.getElementById(`target-tbl-${devTopicId}`);
                        if(el) el.innerText = message;
                    } else if (metric === 'limit_ml') {
                        let limitEl = document.getElementById(`limit-tbl-${devTopicId}`);
                        if(limitEl) limitEl.innerText = message;
                    } else if (metric === 'status') {
                        let statTbl = document.getElementById(`status-tbl-${devTopicId}`);
                        if(statTbl) {
                            statTbl.innerText = formatStatusText(message);
                            if (message === "CONNECTED" || message === "NORMAL" || message === "COMPLETED") {
                                statTbl.style.color = "var(--neon-green)";
                            } else if (message === "DISCONNECTED") {
                                statTbl.style.color = "var(--danger-red)";
                            } else {
                                statTbl.style.color = "var(--danger-red)";
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
