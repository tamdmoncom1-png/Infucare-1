<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfuCare - Giám Sát Dịch Truyền Thông Minh</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT Client CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md py-4 px-6 mb-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">InfuCare - Bệnh Viện Đa Khoa Cà Mau</h1>
            <div id="connection-status" class="px-3 py-1 bg-amber-500 text-white rounded-full text-sm font-semibold">
                Đang kết nối MQTT...
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 pb-12">
        <div id="devices-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Các thẻ thiết bị sẽ được render động tại đây -->
        </div>
    </main>

    <!-- Script Xử Lý MQTT & Giao Diện Dashboard -->
    <script>
        // Cấu hình kết nối MQTT Broker (HiveMQ Cloud Secure)
        const brokerUrl = 'wss://dc96c9840eee44adbb0987edf4172106.s1.eu.hivemq.cloud:8883/mqtt';
        const options = {
            clientId: 'InfuCare_WebDashboard_' + Math.random().toString(16).substring(2, 8),
            username: 'drip_monitor_user',
            password: 'TamCaMau2026',
            clean: true
        };

        // Lưu trữ trạng thái các thiết bị theo ID cố định (tránh bị lệch khi xóa)
        let devicesMap = {};

        // Khởi tạo kết nối MQTT
        const client = mqtt.connect(brokerUrl, options);

        client.on('connect', () => {
            document.getElementById('connection-status').innerText = 'Đã kết nối MQTT';
            document.getElementById('connection-status').className = 'px-3 py-1 bg-emerald-600 text-white rounded-full text-sm font-semibold';
            
            // Subcribe tất cả các topic của thiết bị 10
            client.subscribe('drip_monitor/dev10/#', (err) => {
                if (!err) console.log("Đã đăng ký topic dev10 thành công!");
            });
        });

        client.on('error', (err) => {
            console.error('Lỗi kết nối MQTT: ', err);
            document.getElementById('connection-status').innerText = 'Lỗi kết nối';
            document.getElementById('connection-status').className = 'px-3 py-1 bg-rose-600 text-white rounded-full text-sm font-semibold';
        });

        // Nhận dữ liệu từ MQTT
        client.on('message', (topic, payload) => {
            const message = payload.toString();
            const segments = topic.split('/');
            if (segments.length < 3) return;

            const devId = segments[1]; // vd: dev10
            const property = segments[2]; // flow, target, infused, limit_ml, status, battery

            if (!devicesMap[devId]) {
                // Khởi tạo khung dữ liệu mặc định cho thiết bị nếu chưa có
                devicesMap[devId] = {
                    id: devId,
                    name: "THIẾT BỊ 10 (dev10)",
                    version: "V3",
                    location: "Giường 10",
                    flow: 0,
                    target: 40,
                    infused: "0.0",
                    limit_ml: 500,
                    status: "CONNECTED",
                    battery: "95"
                };
            }

            // Cập nhật giá trị tương ứng
            if (property === 'flow') devicesMap[devId].flow = parseInt(message) || 0;
            else if (property === 'target') devicesMap[devId].target = parseInt(message) || 40;
            else if (property === 'infused') devicesMap[devId].infused = message;
            else if (property === 'limit_ml') devicesMap[devId].limit_ml = message;
            else if (property === 'status') devicesMap[devId].status = message;
            else if (property === 'battery') devicesMap[devId].battery = message;

            // Render lại giao diện
            renderDashboard();
        });

        // Hàm định dạng câu chữ trạng thái chuẩn màu sắc
        function formatStatusText(statusStr) {
            if (!statusStr || statusStr === "CONNECTED") return { text: "Đã kết nối", bg: "bg-slate-100 text-slate-700 border-slate-200" };
            if (statusStr === "NORMAL") return { text: "Đang truyền dịch bình thường", bg: "bg-emerald-50 text-emerald-700 border-emerald-200" };
            if (statusStr === "EXCEEDED") return { text: "⚠️ Cảnh báo: Quá tốc độ dòng!", bg: "bg-amber-50 text-amber-700 border-amber-200" };
            if (statusStr === "STOPPED") return { text: "⚠️ Dừng chảy / Tắt dịch (Đã khóa kẹp)", bg: "bg-orange-50 text-orange-700 border-orange-200" };
            if (statusStr === "AIR_ALARM") return { text: "🚨 CẢNH BÁO BỌT KHÍ! (Đã khóa servo)", bg: "bg-rose-50 text-rose-700 border-rose-200 animate-pulse" };
            if (statusStr === "COMPLETED") return { text: "✅ Hoàn thành thể tích định mức (Đã khóa)", bg: "bg-blue-50 text-blue-700 border-blue-200" };
            if (statusStr === "BELOW") return { text: "⚠️ Tốc độ thấp hơn y lệnh", bg: "bg-amber-50 text-amber-700 border-amber-200" };
            return { text: statusStr, bg: "bg-slate-100 text-slate-700 border-slate-200" };
        }

        // Hàm xóa thiết bị an toàn bằng ID cố định (Không bị dịch mảng/nhảy giá trị)
        function deleteDevice(devId) {
            if (confirm(`Bạn có chắc muốn xóa/reset bảng theo dõi của ${devId}?`)) {
                // Xóa retained message trên broker MQTT
                client.publish(`drip_monitor/${devId}/status`, "", { retained: true });
                // Xóa khỏi danh sách render
                delete devicesMap[devId];
                renderDashboard();
            }
        }

        // Render toàn bộ giao diện Card thiết bị
        function renderDashboard() {
            const container = document.getElementById('devices-container');
            container.innerHTML = '';

            const devIds = Object.keys(devicesMap);
            if (devIds.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-12">Chưa có thiết bị nào kết nối trực tuyến.</div>`;
                return;
            }

            devIds.forEach(devId => {
                const dev = devicesMap[devId];
                const statusInfo = formatStatusText(dev.status);

                const cardHTML = `
                    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 flex flex-col justify-between transition-all hover:shadow-xl">
                        <!-- Card Header -->
                        <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                            <div class="flex items-center space-x-2">
                                <h2 class="text-lg font-bold text-slate-900">${dev.name}</h2>
                                <span class="px-2 py-0.5 bg-indigo-100 text-indigo-700 text-xs font-semibold rounded">${dev.version}</span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="text-xs font-medium px-2.5 py-1 bg-slate-100 rounded-full text-slate-600">🔋 ${dev.battery}%</span>
                                <button onclick="deleteDevice('${dev.id}')" class="text-slate-400 hover:text-rose-600 transition-colors p-1" title="Xóa thiết bị">
                                    🗑️
                                </button>
                            </div>
                        </div>

                        <!-- Location -->
                        <div class="mb-4 flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <span class="text-sm font-medium text-slate-600">VỊ TRÍ:</span>
                            <span class="font-bold text-indigo-600 text-base">${dev.location}</span>
                        </div>

                        <!-- Grid Metrics -->
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <span class="text-xs font-semibold text-slate-500 block mb-1">TỐC ĐỘ THỰC TẾ</span>
                                <div class="flex items-baseline space-x-1">
                                    <span class="text-3xl font-black text-rose-600">${dev.flow}</span>
                                    <span class="text-xs text-slate-500 font-medium">gtt/m</span>
                                </div>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <span class="text-xs font-semibold text-slate-500 block mb-1">TỐC ĐỘ Y LỆNH</span>
                                <div class="flex items-baseline space-x-1">
                                    <span class="text-3xl font-black text-indigo-600">${dev.target}</span>
                                    <span class="text-xs text-slate-500 font-medium">gtt/m</span>
                                </div>
                            </div>
                        </div>

                        <!-- Infused & Limit -->
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-4 flex justify-between items-center">
                            <div>
                                <span class="text-xs font-semibold text-slate-500 block mb-1">TỔNG THỂ TÍCH (ĐÃ TRUYỀN / LIMIT)</span>
                                <span class="text-lg font-bold text-emerald-600">${dev.infused} <span class="text-xs text-slate-500 font-normal">/ ${dev.limit_ml} ml</span></span>
                            </div>
                        </div>

                        <!-- Status Alert Bar -->
                        <div class="p-3 rounded-xl border text-sm font-semibold text-center ${statusInfo.bg}">
                            ${statusInfo.text}
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }
    </script>
</body>
</html>
