<script>
        // Cấu hình MQTT qua WebSocket WSS port 8884
        const brokerUrl = 'wss://dc96c9840eee44adbb0987edf4172106.s1.eu.hivemq.cloud:8884/mqtt';
        const options = {
            clientId: 'WebDashboard_' + Math.random().toString(16).substr(2, 8),
            username: 'drip_monitor_user',
            password: 'TamCaMau2026',
            clean: true
        };

        const client = mqtt.connect(brokerUrl, options);

        let telemetryStore = {};
        let currentDept = localStorage.getItem('infucare_current_dept') || 'KHOA_A';
        let currentView = localStorage.getItem('infucare_view_mode') || 'grid';

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.getAttribute('onclick').includes(currentDept)) {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
            });
            renderApp();
        });

        function getDeviceCount() {
            // Đặt mặc định là 0 thiết bị khi mới truy cập hoặc reset trang chưa thêm thiết bị
            return parseInt(localStorage.getItem(`infucare_device_count_${currentDept}`)) || 0;
        }

        function renderApp() {
            let count = getDeviceCount();
            if (count === 0) {
                document.getElementById('main-content').innerHTML = `
                    <div style="text-align: center; padding: 50px; background: var(--card-bg); border-radius: 16px; border: 1.5px solid var(--card-border);">
                        <h3 style="color: var(--text-muted); margin-bottom: 10px;">Chưa có thiết bị nào trong ${currentDept.replace('_', ' ')}</h3>
                        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Bấm nút "+ Thêm Thiết Bị" phía trên để bắt đầu theo dõi giám sát.</p>
                        <button class="btn-action btn-add" onclick="addNewDevice()" style="margin: 0 auto;">+ Thêm Thiết Bị</button>
                    </div>
                `;
                return;
            }

            if (currentView === 'grid') {
                renderGridView();
            } else {
                renderTableView();
            }
            restoreTelemetryToUI();
        }

        // 1. Render dạng Lưới theo Khoa
        function renderGridView() {
            let count = getDeviceCount();
            let html = '<div class="device-grid">';
            for (let i = 1; i <= count; i++) {
                let devId = i < 10 ? `0${i}` : `${i}`;
                let savedBed = localStorage.getItem(`infucare_${currentDept}_dev_${devId}_bed`) || `Giường ${devId}`;

                html += `
                    <div class="device-card" id="device-${devId}">
                        <div class="device-header">
                            <span class="device-title">Thiết bị ${devId}</span>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="font-size: 11px; color: var(--neon-green); font-weight: bold;">📶 MQTT OK</span>
                                <button class="btn-delete" title="Xóa thiết bị" onclick="removeDevice(${i})">🗑️ Xóa</button>
                            </div>
                        </div>
                        
                        <div class="bed-assign-row">
                            <label>VỊ TRÍ LẮP ĐẶT:</label>
                            <input type="text" class="bed-input" id="bedname-${devId}" value="${savedBed}" onchange="saveBedMapping('${devId}')" placeholder="Nhập giường...">
                        </div>

                        <div class="metric-box">
                            <div class="metric-label">ACTUAL SPEED</div>
                            <div class="metric-value-row">
                                <span class="metric-value" id="flow-${devId}">0</span>
                                <span class="metric-unit">gtt/min</span>
                            </div>
                        </div>

                        <div class="metric-box">
                            <div class="metric-label">TARGET SPEED</div>
                            <div class="metric-value-row">
                                <span class="metric-value target" id="target-${devId}">60</span>
                                <span class="metric-unit">gtt/min</span>
                            </div>
                        </div>

                        <div class="metric-box">
                            <div class="metric-label">TOTAL VOLUME (Infused / Limit)</div>
                            <div class="metric-value-row">
                                <span class="metric-value" id="infused-${devId}" style="font-size: 18px;"><span id="infval-${devId}">0</span> / <span id="limit-${devId}">390</span></span>
                                <span class="metric-unit">ml</span>
                            </div>
                        </div>

                        <div class="device-status-footer" id="status-${devId}">
                            Đang chờ tín hiệu...
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            document.getElementById('main-content').innerHTML = html;
        }

        // 2. Render dạng Bảng theo Khoa
        function renderTableView() {
            let count = getDeviceCount();
            let html = `
                <div class="device-table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Thiết bị</th>
                                <th>Vị trí lắp đặt</th>
                                <th>Tốc độ thực tế</th>
                                <th>Tốc độ cài đặt (Target)</th>
                                <th>Đã truyền / Giới hạn (mL)</th>
                                <th>Trạng thái</th>
                                <th style="text-align: center;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            for (let i = 1; i <= count; i++) {
                let devId = i < 10 ? `0${i}` : `${i}`;
                let savedBed = localStorage.getItem(`infucare_${currentDept}_dev_${devId}_bed`) || `Giường ${devId}`;

                html += `
                    <tr>
                        <td style="font-weight: bold; color: var(--primary-blue);">Thiết bị ${devId}</td>
                        <td><input type="text" class="bed-input" id="bedname-tbl-${devId}" value="${savedBed}" onchange="saveBedMappingTable('${devId}')"></td>
                        <td><span id="flow-tbl-${devId}" style="color: var(--neon-green); font-weight: bold;">0</span> gtt/min</td>
                        <td><span id="target-tbl-${devId}" style="color: var(--primary-blue); font-weight: bold;">60</span> gtt/min</td>
                        <td><span id="infval-tbl-${devId}">0</span> / <span id="limit-tbl-${devId}">390</span> ml</td>
                        <td id="status-tbl-${devId}" style="color: var(--text-muted); font-weight: 500;">Đang chờ...</td>
                        <td style="text-align: center;"><button class="btn-delete" onclick="removeDevice(${i})">🗑️ Xóa</button></td>
                    </tr>
                `;
            }
            html += `
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function switchDept(deptKey, btn) {
            currentDept = deptKey;
            localStorage.setItem('infucare_current_dept', deptKey);
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderApp();
        }

        function addNewDevice() {
            let count = getDeviceCount() + 1;
            localStorage.setItem(`infucare_device_count_${currentDept}`, count);
            renderApp();
        }

        function removeDevice(index) {
            let count = getDeviceCount();
            if (confirm(`Bạn có chắc chắn muốn xóa thiết bị này khỏi ${currentDept.replace('_', ' ')} không?`)) {
                for (let i = index; i < count; i++) {
                    let nextId = (i + 1) < 10 ? `0${i+1}` : `${i+1}`;
                    let currId = i < 10 ? `0${i}` : `${i}`;
                    let nextBed = localStorage.getItem(`infucare_${currentDept}_dev_${nextId}_bed`) || `Giường ${i+1}`;
                    localStorage.setItem(`infucare_${currentDept}_dev_${currId}_bed`, nextBed);
                }
                localStorage.removeItem(`infucare_${currentDept}_dev_${count}_bed`);
                localStorage.setItem(`infucare_device_count_${currentDept}`, count - 1);
                renderApp();
            }
        }

        function setViewMode(mode) {
            currentView = mode;
            localStorage.setItem('infucare_view_mode', mode);
            renderApp();
        }

        function saveBedMapping(devId) {
            let val = document.getElementById(`bedname-${devId}`).value;
            localStorage.setItem(`infucare_${currentDept}_dev_${devId}_bed`, val);
        }

        function saveBedMappingTable(devId) {
            let val = document.getElementById(`bedname-tbl-${devId}`).value;
            localStorage.setItem(`infucare_${currentDept}_dev_${devId}_bed`, val);
        }

        function restoreTelemetryToUI() {
            if (!telemetryStore[currentDept]) return;
            let count = getDeviceCount();
            for (let i = 1; i <= count; i++) {
                let devId = i < 10 ? `0${i}` : `${i}`;
                let data = telemetryStore[currentDept][devId];
                if (!data) continue;

                if (currentView === 'grid') {
                    if (data.flow !== undefined) {
                        let el = document.getElementById(`flow-${devId}`);
                        if(el) el.innerText = data.flow;
                        let footer = document.getElementById(`status-${devId}`);
                        if(footer) { footer.innerText = data.statusText || "Đang truyền bình thường"; footer.classList.add('active'); }
                    }
                    if (data.infused !== undefined) {
                        let el = document.getElementById(`infval-${devId}`);
                        if(el) el.innerText = data.infused;
                    }
                    if (data.target !== undefined) {
                        let el = document.getElementById(`target-${devId}`);
                        if(el) el.innerText = data.target;
                    }
                    if (data.limit !== undefined) {
                        let el = document.getElementById(`limit-${devId}`);
                        if(el) el.innerText = data.limit;
                    }
                } else {
                    if (data.flow !== undefined) {
                        let el = document.getElementById(`flow-tbl-${devId}`);
                        if(el) el.innerText = data.flow;
                    }
                    if (data.infused !== undefined) {
                        let el = document.getElementById(`infval-tbl-${devId}`);
                        if(el) el.innerText = data.infused;
                    }
                    if (data.target !== undefined) {
                        let el = document.getElementById(`target-tbl-${devId}`);
                        if(el) el.innerText = data.target;
                    }
                    if (data.limit !== undefined) {
                        let el = document.getElementById(`limit-tbl-${devId}`);
                        if(el) el.innerText = data.limit;
                    }
                    if (data.statusText !== undefined) {
                        let el = document.getElementById(`status-tbl-${devId}`);
                        if(el) el.innerText = data.statusText;
                    }
                }
            }
        }

        client.on('connect', () => {
            const badge = document.getElementById('connection-status');
            badge.innerText = 'ONLINE';
            badge.classList.add('online');
            client.subscribe('drip_monitor/#');
        });

        client.on('offline', () => {
            const badge = document.getElementById('connection-status');
            badge.innerText = 'DISCONNECTED';
            badge.classList.remove('online');
        });

        client.on('message', (topic, payload) => {
            const message = payload.toString();
            const parts = topic.split('/');
            
            if (parts.length >= 3) {
                const devId = parts[1]; 
                const metric = parts[2]; 
                let cardId = devId.replace('dev', '');

                if (!telemetryStore[currentDept]) telemetryStore[currentDept] = {};
                if (!telemetryStore[currentDept][cardId]) telemetryStore[currentDept][cardId] = {};

                if (metric === 'flow') telemetryStore[currentDept][cardId].flow = message;
                if (metric === 'infused') telemetryStore[currentDept][cardId].infused = message;
                if (metric === 'target') telemetryStore[currentDept][cardId].target = message;
                if (metric === 'limit_ml') telemetryStore[currentDept][cardId].limit = message;
                if (metric === 'status') telemetryStore[currentDept][cardId].statusText = message;

                if (currentView === 'grid') {
                    if (metric === 'flow') {
                        let el = document.getElementById(`flow-${cardId}`);
                        if(el) el.innerText = message;
                        let footer = document.getElementById(`status-${cardId}`);
                        if(footer) { footer.innerText = "Đang truyền bình thường"; footer.classList.add('active'); }
                    } else if (metric === 'infused') {
                        let el = document.getElementById(`infval-${cardId}`);
                        if(el) el.innerText = message;
                    } else if (metric === 'target') {
                        let el = document.getElementById(`target-${cardId}`);
                        if(el) el.innerText = message;
                    } else if (metric === 'limit_ml') {
                        let limitEl = document.getElementById(`limit-${cardId}`);
                        if(limitEl) limitEl.innerText = message;
                    } else if (metric === 'status') {
                        let footer = document.getElementById(`status-${cardId}`);
                        if(footer) {
                            footer.innerText = message;
                            if(message === 'NORMAL' || message === 'RUNNING_TEST') footer.classList.add('active');
                            else footer.classList.remove('active');
                        }
                    }
                } else {
                    if (metric === 'flow') {
                        let el = document.getElementById(`flow-tbl-${cardId}`);
                        if(el) el.innerText = message;
                    } else if (metric === 'infused') {
                        let el = document.getElementById(`infval-tbl-${cardId}`);
                        if(el) el.innerText = message;
                    } else if (metric === 'target') {
                        let el = document.getElementById(`target-tbl-${cardId}`);
                        if(el) el.innerText = message;
                    } else if (metric === 'limit_ml') {
                        let limitEl = document.getElementById(`limit-tbl-${cardId}`);
                        if(limitEl) limitEl.innerText = message;
                    } else if (metric === 'status') {
                        let el = document.getElementById(`status-tbl-${cardId}`);
                        if(el) el.innerText = message;
                    }
                }
            }
        });
    </script>
