<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfuCare - Quản Lý Giường Bệnh IoT</title>
    <!-- Thư viện MQTT.js qua CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-dark: #0b1120;
            --card-bg: #131d31;
            --card-border: #1e293b;
            --primary-cyan: #06b6d4;
            --neon-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-blue: #2563eb;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        /* Header Top */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-cyan);
            letter-spacing: 0.5px;
        }
        /* Tabs Khoa */
        .dept-tabs {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            background: #1e293b;
            border: none;
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }
        /* Action bar bên phải */
        .actions-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-action {
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-add {
            background: #059669;
            border: none;
            color: white;
            font-weight: bold;
        }
        .connection-badge {
            background: #1e293b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #ef4444;
            border: 1px solid var(--card-border);
        }
        .connection-badge.online {
            color: var(--neon-green);
        }

        /* Grid Danh Sách Giường */
        .bed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .bed-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            position: relative;
        }
        .bed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }
        .bed-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
        }
        .bed-icons {
            display: flex;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Các khối thông số bên trong thẻ giường */
        .metric-box {
            background: #090e17;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #1a233a;
        }
        .metric-label {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .metric-value-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .metric-value {
            font-size: 26px;
            font-weight: bold;
            color: var(--neon-green);
        }
        .metric-value.target {
            color: var(--primary-cyan);
        }
        .metric-unit {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        /* Trạng thái dưới cùng của thẻ giường */
        .bed-status-footer {
            background: #1b263b;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 12px;
            font-weight: 500;
        }
        .bed-status-footer.active {
            color: var(--neon-green);
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body>

    <!-- Header chính -->
    <div class="header-bar">
        <div class="logo">InfuCare</div>
        
        <div class="dept-tabs">
            <button class="tab-btn active" onclick="switchDept('KHOA A', this)">KHOA A</button>
            <button class="tab-btn" onclick="switchDept('KHOA B', this)">KHOA B</button>
            <button class="tab-btn" onclick="switchDept('KHOA C', this)">KHOA C</button>
        </div>

        <div class="actions-right">
            <button class="btn-action btn-add">+ Thêm Giường Mới</button>
            <button class="btn-action">📦 Khối</button>
            <button class="btn-action">📋 Bảng</button>
            <div id="connection-status" class="connection-badge">Đang kết nối...</div>
        </div>
    </div>

    <!-- Lưới hiển thị các giường (Giường 01 đến Giường 10) -->
    <div class="bed-grid" id="bed-container">
        <!-- Các thẻ giường sẽ được sinh tự động bằng JavaScript bên dưới -->
    </div>

    <script>
        // Cấu hình kết nối MQTT Broker qua WebSockets (HiveMQ Cloud WSS port 8884)[cite: 7]
        const brokerUrl = 'wss://dc96c9840eee44adbb0987edf4172106.s1.eu.hivemq.cloud:8884/mqtt';
        const options = {
            clientId: 'WebDashboard_' + Math.random().toString(16).substr(2, 8),
            username: 'drip_monitor_user',
            password: 'TamCaMau2026',
            clean: true
        };

        const client = mqtt.connect(brokerUrl, options);

        // Khởi tạo danh sách 10 giường bệnh mẫu
        const totalBeds = 10;
        const bedContainer = document.getElementById('bed-container');

        function initBeds() {
            let html = '';
            for (let i = 1; i <= totalBeds; i++) {
                let bedId = i < 10 ? `0${i}` : `${i}`;
                html += `
                    <div class="bed-card" id="bed-${bedId}">
                        <div class="bed-header">
                            <span class="bed-title">Giường ${bedId}</span>
                            <span class="bed-icons">📶 --% 🔍 🗑️</span>
                        </div>
                        
                        <div class="metric-box">
                            <div class="metric-label">ACTUAL SPEED</div>
                            <div class="metric-value-row">
                                <span class="metric-value" id="flow-${bedId}">0</span>
                                <span class="metric-unit">gtt/min</span>
                            </div>
                        </div>

                        <div class="metric-box">
                            <div class="metric-label">TARGET</div>
                            <div class="metric-value-row">
                                <span class="metric-value target" id="target-${bedId}">60</span>
                                <span class="metric-unit">gtt/min</span>
                            </div>
                        </div>

                        <div class="metric-box">
                            <div class="metric-label">TOTAL VOLUME</div>
                            <div class="metric-value-row">
                                <span class="metric-value" id="infused-${bedId}" style="font-size: 20px;">0 / <span id="limit-${bedId}">390</span></span>
                                <span class="metric-unit">ml</span>
                            </div>
                        </div>

                        <div class="bed-status-footer" id="status-${bedId}">
                            Đang chờ tín hiệu...
                        </div>
                    </div>
                `;
            }
            bedContainer.innerHTML = html;
        }

        initBeds();

        // Chuyển tab khoa phòng
        function switchDept(deptName, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            console.log("Đã chuyển sang: " + deptName);
        }

        // Xử lý sự kiện MQTT
        client.on('connect', () => {
            const badge = document.getElementById('connection-status');
            badge.innerText = 'ONLINE';
            badge.classList.add('online');
            
            // Đăng ký nhận dữ liệu topic chung hoặc theo giường (ví dụ: drip_monitor/#)
            client.subscribe('drip_monitor/#', (err) => {
                if (!err) console.log("Subscribed to drip_monitor/# successfully");
            });
        });

        client.on('offline', () => {
            const badge = document.getElementById('connection-status');
            badge.innerText = 'DISCONNECTED';
            badge.classList.remove('online');
        });

        // Nhận gói tin từ ESP32 cập nhật cho Giường 01 (hoặc các giường khác tương ứng)
        client.on('message', (topic, payload) => {
            const message = payload.toString();
            // Mặc định tạm gán dữ liệu thực tế vào Giường 01 để test
            const bedId = "01"; 

            if (topic === 'drip_monitor/flow') {
                document.getElementById(`flow-${bedId}`).innerText = message;
                let footer = document.getElementById(`status-${bedId}`);
                footer.innerText = "Đang truyền bình thường";
                footer.classList.add('active');
            } else if (topic === 'drip_monitor/infused') {
                document.getElementById(`infused-${bedId}`).innerHTML = `${message} / <span id="limit-${bedId}">390</span>`;
            } else if (topic === 'drip_monitor/target') {
                document.getElementById(`target-${bedId}`).innerText = message;
            } else if (topic === 'drip_monitor/limit_ml') {
                document.getElementById(`limit-${bedId}`).innerText = message;
            } else if (topic === 'drip_monitor/status') {
                let footer = document.getElementById(`status-${bedId}`);
                footer.innerText = message;
                if(message === 'NORMAL' || message === 'RUNNING_TEST') {
                    footer.classList.add('active');
                } else {
                    footer.classList.remove('active');
                }
            }
        });
    </script>
</body>
</html>
