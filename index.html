<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfuCare - Quản Lý Thiết Bị Dự Án IoT</title>
    <!-- Thư viện MQTT.js qua CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-dark: #0b1120;
            --card-bg: #131d31;
            --card-border: #1e293b;
            --primary-cyan: #06b6d4;
            --neon-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-blue: #2563eb;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        /* Header Top */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-cyan);
            letter-spacing: 0.5px;
        }
        /* Tabs Khoa */
        .dept-tabs {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            background: #1e293b;
            border: none;
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }
        /* Actions right */
        .actions-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .connection-badge {
            background: #1e293b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #ef4444;
            border: 1px solid var(--card-border);
        }
        .connection-badge.online {
            color: var(--neon-green);
        }

        /* Grid Danh Sách Thiết Bị */
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .device-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            position: relative;
        }
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }
        .device-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--text-main);
        }
        
        /* Khu vực nhập vị trí giường linh hoạt */
        .bed-assign-row {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #090e17;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #1a233a;
            margin-bottom: 12px;
        }
        .bed-assign-row label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: bold;
        }
        .bed-input {
            background: #131d31;
            border: 1px solid var(--card-border);
            color: var(--primary-cyan);
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 5px;
            width: 70px;
            text-align: center;
            font-size: 13px;
        }

        /* Các khối thông số */
        .metric-box {
            background: #090e17;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid #1a233a;
        }
        .metric-label {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .metric-value-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--neon-green);
        }
        .metric-value.target {
            color: var(--primary-cyan);
        }
        .metric-unit {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        /* Trạng thái dưới cùng */
        .device-status-footer {
            background: #1b263b;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            font-weight: 500;
        }
        .device-status-footer.active {
            color: var(--neon-green);
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body>

    <!-- Header chính -->
    <div class="header-bar">
        <div class="logo">InfuCare</div>
        
        <div class="dept-tabs">
            <button class="tab-btn active" onclick="switchDept('KHOA A', this)">KHOA A</button>
            <button class="tab-btn" onclick="switchDept('KHOA B', this)">KHOA B</button>
            <button class="tab-btn" onclick="switchDept('KHOA C', this)">KHOA C</button>
        </div>

        <div class="actions-right">
            <div id="connection-status" class="connection-badge">Đang kết nối...</div>
        </div>
    </div>

    <!-- Lưới hiển thị danh sách thiết bị -->
    <div class="device-grid" id="device-container">
        <!-- Render tự động qua JS -->
    </div>

    <script>
        // Cấu hình MQTT qua WebSocket WSS port 8884
        const brokerUrl = 'wss://dc96c9840eee44adbb0987edf4172106.s1.eu.hivemq.cloud:8884/mqtt';
        const options = {
            clientId: 'WebDashboard_' + Math.random().toString(16).substr(2, 8),
            username: 'drip_monitor_user',
            password: 'TamCaMau2026',
            clean: true
        };

        const client = mqtt.connect(brokerUrl, options);

        const totalDevices = 10;
        const deviceContainer = document.getElementById('device-container');

        function initDevices() {
            let html = '';
            for (let i = 1; i <= totalDevices; i++) {
                let devId = i < 10 ? `0${i}` : `${i}`;
                // Đọc vị trí giường đã lưu trước đó nếu có
                let savedBed = localStorage.getItem(`infucare_dev_${devId}_bed`) || `Giường ${devId}`;

                html += `
                    <div class="device-card" id="device-${devId}">
                        <div class="device-header">
                            <span class="device-title">Thiết bị ${devId}</span>
                            <span style="font-size: 11px; color: var(--text-muted);">📶 MQTT OK</span>
                        </div>
                        
                        <!-- Ô nhập gán vị trí giường linh hoạt -->
                        <div class="bed-assign-row">
                            <label>Vị trí:</label>
                            <input type="text" class="bed-input" id="bedname-${devId}" value="${savedBed}" onchange="saveBedMapping('${devId}')" placeholder="Nhập giường...">
                        </div>

                        <div class="metric-box">
                            <div class="metric-label">ACTUAL SPEED</div>
                            <div class="metric-value-row">
                                <span class="metric-value" id="flow-${devId}">0</span>
                                <span class="metric-unit">gtt/min</span>
                            </div>
                        </div>

                        <div class="metric-box">
                            <div class="metric-label">TARGET SPEED</div>
                            <div class="metric-value-row">
                                <span class="metric-value target" id="target-${devId}">60</span>
                                <span class="metric-unit">gtt/min</span>
                            </div>
                        </div>

                        <div class="metric-box">
                            <div class="metric-label">TOTAL VOLUME (Infused / Limit)</div>
                            <div class="metric-value-row">
                                <span class="metric-value" id="infused-${devId}" style="font-size: 18px;">0 / <span id="limit-${devId}">390</span></span>
                                <span class="metric-unit">ml</span>
                            </div>
                        </div>

                        <div class="device-status-footer" id="status-${devId}">
                            Đang chờ tín hiệu...
                        </div>
                    </div>
                `;
            }
            deviceContainer.innerHTML = html;
        }

        initDevices();

        // Lưu vị trí giường vào bộ nhớ trình duyệt khi người dùng thay đổi
        function saveBedMapping(devId) {
            let val = document.getElementById(`bedname-${devId}`).value;
            localStorage.setItem(`infucare_dev_${devId}_bed`, val);
        }

        function switchDept(deptName, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // MQTT Events
        client.on('connect', () => {
            const badge = document.getElementById('connection-status');
            badge.innerText = 'ONLINE';
            badge.classList.add('online');
            client.subscribe('drip_monitor/#');
        });

        client.on('offline', () => {
            const badge = document.getElementById('connection-status');
            badge.innerText = 'DISCONNECTED';
            badge.classList.remove('online');
        });

        // Nhận dữ liệu từ thiết bị (Mặc định ánh xạ dữ liệu vào Thiết bị 01 để test thực tế)
        client.on('message', (topic, payload) => {
            const message = payload.toString();
            const devId = "01"; // Có thể mở rộng topic theo device ID sau này (ví dụ: drip_monitor/dev01/flow)

            if (topic === 'drip_monitor/flow') {
                document.getElementById(`flow-${devId}`).innerText = message;
                let footer = document.getElementById(`status-${devId}`);
                footer.innerText = "Đang truyền bình thường";
                footer.classList.add('active');
            } else if (topic === 'drip_monitor/infused') {
                document.getElementById(`infused-${devId}`).innerHTML = `${message} / <span id="limit-${devId}">390</span>`;
            } else if (topic === 'drip_monitor/target') {
                document.getElementById(`target-${devId}`).innerText = message;
            } else if (topic === 'drip_monitor/limit_ml') {
                document.getElementById(`limit-${devId}`).innerText = message;
            } else if (topic === 'drip_monitor/status') {
                let footer = document.getElementById(`status-${devId}`);
                footer.innerText = message;
                if(message === 'NORMAL' || message === 'RUNNING_TEST') {
                    footer.classList.add('active');
                } else {
                    footer.classList.remove('active');
                }
            }
        });
    </script>
</body>
</html>
